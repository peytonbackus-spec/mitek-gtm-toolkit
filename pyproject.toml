[project]
name = "mitek-gtm-toolkit"
version = "0.3.0"
description = "GTM Engineer + GTM Strategy & Ops toolkit for Mitek Systems, on a shared Salesforce / AI-governance core"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
live = ["anthropic>=0.40"]   # only for GTM_LLM_MODE=anthropic

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
